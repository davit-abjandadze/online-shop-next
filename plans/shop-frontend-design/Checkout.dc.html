<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  :root {
    --ref-bg:#f0f2f5; --ref-bg-elevated:#ffffff; --ref-bg-subtle:#f7f8fa;
    --ref-text-primary:#050505; --ref-text-secondary:#65676b; --ref-text-disabled:#bcc0c4;
    --ref-border:#ced0d4; --ref-border-soft:#e4e6eb;
    --ref-primary:#1a56db; --ref-primary-hover:#1240a8; --ref-primary-soft:#e7f3ff;
    --ref-danger:#f43e50;
    --ref-shadow-sm:0 1px 2px rgba(0,0,0,.12); --ref-shadow-md:0 4px 14px rgba(0,0,0,.1);
  }
  body { margin:0; font-family:"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif; background:var(--ref-bg); color:var(--ref-text-primary); }
  a { color: var(--ref-primary); text-decoration:none; }
  a:hover { color: var(--ref-primary-hover); }
  input, textarea { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--ref-text-disabled); }
</style>
</helmet>

<div style="width:1280px;min-height:100%;background:var(--ref-bg);">

  <!-- Header -->
  <div style="height:64px;background:var(--ref-bg-elevated);border-bottom:1px solid var(--ref-border-soft);box-shadow:var(--ref-shadow-sm);display:flex;align-items:center;">
    <div style="max-width:1232px;width:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ref-primary),var(--ref-primary-hover));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;">მ</div>
        <span style="font-size:18px;font-weight:700;">მაღაზია</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <button type="button" style="position:relative;width:40px;height:40px;border:none;border-radius:50%;background:var(--ref-bg-subtle);display:flex;align-items:center;justify-content:center;color:var(--ref-text-primary);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </button>
        <div style="width:36px;height:36px;border-radius:50%;background:var(--ref-primary-soft);color:var(--ref-primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">დბ</div>
      </div>
    </div>
  </div>

  <div style="max-width:1232px;margin:0 auto;padding:32px 24px 64px;">
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ref-text-secondary);margin-bottom:8px;">
      <a href="#" style="color:var(--ref-text-secondary);">კალათა</a><span>/</span><span style="color:var(--ref-text-primary);font-weight:600;">შეკვეთის გაფორმება</span>
    </div>
    <h1 style="margin:0 0 28px;font-size:26px;font-weight:700;">შეკვეთის გაფორმება</h1>

    <div style="display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;">

      <!-- Shipping form -->
      <div style="background:var(--ref-bg-elevated);border:1px solid var(--ref-border-soft);border-radius:12px;box-shadow:var(--ref-shadow-sm);padding:28px;">
        <h3 style="margin:0 0 20px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ref-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
          მიწოდების მისამართი
        </h3>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">სახელი</label>
            <input type="text" value="დავით" style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);"/>
          </div>
          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">გვარი</label>
            <input type="text" value="აბჯანძე" style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);"/>
          </div>
        </div>

        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">ტელეფონის ნომერი</label>
          <input type="text" value="+995 555 12 34 56" style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);"/>
        </div>

        <div style="display:grid;grid-template-columns:1fr 160px;gap:16px;margin-bottom:16px;">
          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">ქალაქი</label>
            <input type="text" value="თბილისი" style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);"/>
          </div>
          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">საფოსტო ინდექსი</label>
            <input type="text" value="0179" style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);"/>
          </div>
        </div>

        <div style="margin-bottom:16px;">
          <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">მისამართი</label>
          <input type="text" value="ვაჟა-ფშაველას გამზირი 45, ბ. 12" style="width:100%;height:44px;padding:0 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);"/>
        </div>

        <div>
          <label style="display:block;font-size:13px;font-weight:600;color:var(--ref-text-secondary);margin-bottom:6px;">კომენტარი კურიერისთვის (არასავალდებულო)</label>
          <textarea rows="3" placeholder="მაგ. კარიბჭის კოდი, სასურველი მიტანის დრო..." style="width:100%;padding:12px 14px;border:1px solid var(--ref-border);border-radius:8px;font-size:14px;color:var(--ref-text-primary);background:var(--ref-bg-elevated);resize:none;"></textarea>
        </div>
      </div>

      <!-- Summary -->
      <div style="background:var(--ref-bg-elevated);border:1px solid var(--ref-border-soft);border-radius:12px;box-shadow:var(--ref-shadow-sm);padding:22px;position:sticky;top:20px;">
        <h3 style="margin:0 0 16px;font-size:16px;font-weight:700;">შეკვეთის შემადგენლობა</h3>

        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:var(--ref-text-secondary);">უსადენო ყურსასმენები Pro X200 × 1</span><span style="font-weight:600;">₾249</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:var(--ref-text-secondary);">სმარტ საათი FitBand 5 × 1</span><span style="font-weight:600;">₾189</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;">
            <span style="color:var(--ref-text-secondary);">ტყავის საფულე × 2</span><span style="font-weight:600;">₾170</span>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--ref-text-secondary);margin-bottom:10px;padding-top:12px;border-top:1px solid var(--ref-border-soft);">
          <span>ქვეჯამი</span><span>₾608</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--ref-text-secondary);margin-bottom:16px;">
          <span>მიწოდება</span><span>₾10</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding-top:16px;border-top:1px solid var(--ref-border-soft);margin-bottom:20px;">
          <span>ჯამი</span><span>₾618</span>
        </div>

        <div style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--ref-border-soft);border-radius:8px;background:var(--ref-bg-subtle);margin-bottom:20px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ref-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          <span style="font-size:13px;color:var(--ref-text-secondary);">გადახდა უსაფრთხოდ — Bank of Georgia</span>
        </div>

        <button style="width:100%;height:50px;border:none;border-radius:10px;background:var(--ref-primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;">შეკვეთის გაფორმება და გადახდა</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
