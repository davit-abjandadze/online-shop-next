<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  :root {
    --ref-bg:#f0f2f5; --ref-bg-elevated:#ffffff;
    --ref-text-primary:#050505; --ref-text-secondary:#65676b;
    --ref-border-soft:#e4e6eb;
    --ref-primary:#1a56db; --ref-primary-hover:#1240a8;
    --ref-success:#30c582; --ref-success-soft:#dff7ec;
    --ref-danger:#f43e50; --ref-danger-soft:#fde8ea;
    --ref-shadow-md:0 4px 14px rgba(0,0,0,.1);
  }
  body { margin:0; font-family:"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif; background:var(--ref-bg); color:var(--ref-text-primary); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 1s linear infinite; }
</style>
</helmet>

<div style="width:640px;min-height:520px;background:var(--ref-bg);display:flex;align-items:center;justify-content:center;padding:40px;">
  <div style="width:100%;max-width:440px;background:var(--ref-bg-elevated);border-radius:16px;box-shadow:var(--ref-shadow-md);padding:44px 36px;text-align:center;">

    <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:28px;">
      <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ref-primary),var(--ref-primary-hover));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;">მ</div>
      <span style="font-size:15px;font-weight:700;">მაღაზია</span>
    </div>

    <!-- Confirming state -->
    <sc-if value="{{ isConfirming }}" hint-placeholder-val="{{ false }}">
      <div style="width:72px;height:72px;border-radius:50%;border:4px solid var(--ref-border-soft);border-top-color:var(--ref-primary);margin:0 auto 24px;" class="spinner"></div>
      <h2 style="margin:0 0 10px;font-size:20px;font-weight:700;">გადახდა მოწმდება...</h2>
      <p style="margin:0;font-size:14px;color:var(--ref-text-secondary);line-height:1.6;">გთხოვთ მოითმინოთ — ვადასტურებთ თქვენს გადახდას ბანკთან ერთად. ეს რამდენიმე წამს შეიძლება დასჭირდეს.</p>
    </sc-if>

    <!-- Success state -->
    <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ true }}">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--ref-success-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--ref-success)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
      </div>
      <h2 style="margin:0 0 10px;font-size:20px;font-weight:700;">გადახდა წარმატებით დასრულდა</h2>
      <p style="margin:0 0 20px;font-size:14px;color:var(--ref-text-secondary);">შეკვეთა #10234 — ₾618</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button style="height:46px;border:none;border-radius:10px;background:var(--ref-primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">შეკვეთის ნახვა</button>
        <button style="height:46px;border:1px solid var(--ref-border-soft);border-radius:10px;background:transparent;color:var(--ref-text-primary);font-size:14px;font-weight:600;cursor:pointer;">კატალოგში დაბრუნება</button>
      </div>
    </sc-if>

    <!-- Fail state -->
    <sc-if value="{{ isFail }}" hint-placeholder-val="{{ false }}">
      <div style="width:72px;height:72px;border-radius:50%;background:var(--ref-danger-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--ref-danger)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 1 21h22L12 2Z"/><path d="M12 9v5"/><path d="M12 17h.01"/></svg>
      </div>
      <h2 style="margin:0 0 10px;font-size:20px;font-weight:700;">გადახდა ვერ განხორციელდა</h2>
      <p style="margin:0 0 20px;font-size:14px;color:var(--ref-text-secondary);">შეკვეთა #10234 გადახდილი არ არის. სცადეთ სხვა ბარათით ან დაუკავშირდით ბანკს.</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button style="height:46px;border:none;border-radius:10px;background:var(--ref-primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">თავიდან ცდა</button>
        <button style="height:46px;border:1px solid var(--ref-border-soft);border-radius:10px;background:transparent;color:var(--ref-text-primary);font-size:14px;font-weight:600;cursor:pointer;">კალათაში დაბრუნება</button>
      </div>
    </sc-if>
  </div>
</div>

<script data-dc-script data-props='{"state":{"editor":"enum","options":["confirming","success","fail"],"default":"success","section":"მდგომარეობა"}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? "success";
    return {
      isConfirming: state === "confirming",
      isSuccess: state === "success",
      isFail: state === "fail",
    };
  }
}
</script>
</x-dc>
</body>
</html>
