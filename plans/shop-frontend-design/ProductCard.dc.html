<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  :root {
    --ref-bg:#f0f2f5; --ref-bg-elevated:#ffffff; --ref-bg-subtle:#f7f8fa;
    --ref-text-primary:#050505; --ref-text-secondary:#65676b; --ref-text-disabled:#bcc0c4;
    --ref-border-soft:#e4e6eb;
    --ref-primary:#1a56db;
    --ref-warning-soft:#fff4dd; --ref-danger-soft:#fde8ea; --ref-danger:#f43e50;
    --ref-shadow-sm:0 1px 2px rgba(0,0,0,.12);
  }
  body { margin:0; font-family:"Helvetica Neue",-apple-system,"Segoe UI",Arial,sans-serif; background:var(--ref-bg); color:var(--ref-text-primary); }
</style>
</helmet>

<div style="width:940px;padding:32px;background:var(--ref-bg);">
  <div style="font-size:13px;font-weight:700;color:var(--ref-text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px;">ProductCard — კომპონენტი</div>

  <div style="display:grid;grid-template-columns:repeat(3,260px);gap:24px;">

    <!-- In stock -->
    <div>
      <div style="background:var(--ref-bg-elevated);border:1px solid var(--ref-border-soft);border-radius:10px;overflow:hidden;box-shadow:var(--ref-shadow-sm);display:flex;flex-direction:column;">
        <div style="position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#eef2f8,#dfe6f0);display:flex;align-items:center;justify-content:center;">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--ref-text-disabled)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8"/><path d="M3.27 6.96 12 12l8.73-5.04"/><path d="M12 22V12"/><path d="M17 4.5 7 10"/></svg>
          <span style="position:absolute;top:10px;left:10px;background:var(--ref-bg-elevated);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ref-text-secondary);">ტექნიკა</span>
        </div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:14px;font-weight:600;line-height:1.4;min-height:40px;">სმარტ საათი FitBand 5</div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:17px;font-weight:700;">₾189</span>
            <button style="width:36px;height:36px;border:none;border-radius:8px;background:var(--ref-primary);color:#fff;display:flex;align-items:center;justify-content:center;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--ref-text-secondary);margin-top:10px;">მარაგშია</div>
    </div>

    <!-- Low stock -->
    <div>
      <div style="background:var(--ref-bg-elevated);border:1px solid var(--ref-border-soft);border-radius:10px;overflow:hidden;box-shadow:var(--ref-shadow-sm);display:flex;flex-direction:column;">
        <div style="position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#eef2f8,#dfe6f0);display:flex;align-items:center;justify-content:center;">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--ref-text-disabled)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8"/><path d="M3.27 6.96 12 12l8.73-5.04"/><path d="M12 22V12"/><path d="M17 4.5 7 10"/></svg>
          <span style="position:absolute;top:10px;left:10px;background:var(--ref-bg-elevated);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ref-text-secondary);">ტექნიკა</span>
          <span style="position:absolute;top:10px;right:10px;background:var(--ref-warning-soft);color:#b45309;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;">ბოლო 3 ცალი</span>
        </div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:14px;font-weight:600;line-height:1.4;min-height:40px;">უსადენო ყურსასმენები Pro X200</div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:17px;font-weight:700;">₾249</span>
            <button style="width:36px;height:36px;border:none;border-radius:8px;background:var(--ref-primary);color:#fff;display:flex;align-items:center;justify-content:center;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--ref-text-secondary);margin-top:10px;">დაბალი მარაგი</div>
    </div>

    <!-- Out of stock -->
    <div>
      <div style="background:var(--ref-bg-elevated);border:1px solid var(--ref-border-soft);border-radius:10px;overflow:hidden;box-shadow:var(--ref-shadow-sm);display:flex;flex-direction:column;opacity:0.6;">
        <div style="position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#eef2f8,#dfe6f0);display:flex;align-items:center;justify-content:center;">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--ref-text-disabled)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8"/><path d="M3.27 6.96 12 12l8.73-5.04"/><path d="M12 22V12"/><path d="M17 4.5 7 10"/></svg>
          <span style="position:absolute;top:10px;left:10px;background:var(--ref-bg-elevated);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;color:var(--ref-text-secondary);">სახლი და ბაღი</span>
          <span style="position:absolute;top:10px;right:10px;background:var(--ref-danger-soft);color:var(--ref-danger);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;">ამოიწურა</span>
        </div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:14px;font-weight:600;line-height:1.4;min-height:40px;">ქეთლი შავი, 1.7ლ</div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:17px;font-weight:700;">₾110</span>
            <button disabled style="height:36px;padding:0 12px;border:none;border-radius:8px;background:var(--ref-border-soft);color:var(--ref-text-disabled);font-size:12px;font-weight:600;">არ არის</button>
          </div>
        </div>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--ref-text-secondary);margin-top:10px;">ამოწურული</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
